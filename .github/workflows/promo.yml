name: Kunduzgi Reklama Posti

on:
  schedule:
    # Vaqtlar UTC bo'yicha. Toshkent (UTC+5) uchun, kunduzi 3 marta:
    # 05:00 UTC -> 10:00 Toshkent
    # 09:00 UTC -> 14:00 Toshkent
    # 13:00 UTC -> 18:00 Toshkent
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # "Run workflow" tugmasi orqali qo'lda ham ishga tushirish mumkin

jobs:
  promo:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install requests

      - name: Reklama posti yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python promo_post.py
